agent:
  max_tool_rounds: 0
  system_prompt: systemprompt/default.md
channels:
  telegram:
    enabled: false
    mode: polling
  wechat:
    enabled: false
    mode: polling
host: localhost
llm:
  default: anthropic
  fallback:
  - openai
  providers:
  - advisor: opus
    name: anthropic
    provider: anthropic
  - name: openai
    provider: openai
memory:
  db_path: ./data/memory.db
  max_context_messages: 200
  token_window: 100000
port: 8000
sandbox:
  max_output: 10000
  timeout: 60
tools:
  read_file: true
  run_code: true
  web_search: true

agent:
  chars_per_token: 3
  context_window_tokens: 128000
  hard_max_rounds: 200
  max_message_len: 50000
  max_tool_rounds: 0
  system_prompt: systemprompt/default.md
channels:
  telegram:
    allowed_users: []
    enabled: false
    mode: polling
  wechat:
    allowed_users: []
    enabled: false
    mode: polling
dream:
  batch_size: 30
embedding:
  api_key: ''
  base_url: http://localhost:1234/v1
  model: text-embedding-nomic-embed-text-v1.5
  provider: local
heartbeat:
  default_interval: 3600
hooks:
  rate_limit_per_minute: 30
  rate_limit_window: 60
host: localhost
llm:
  compressor: anthropic/claude-haiku-4-5
  default: anthropic/claude-sonnet-4-6
  fallback:
  - openai/gpt5.4-mini
  - localhost/gemma-4-e4b-it
  model_cache_ttl: 300
  models:
  - model: claude-haiku-4-5
    name: anthropic/claude-haiku-4-5
    provider: anthropic
  - model: claude-sonnet-4-6
    name: anthropic/claude-sonnet-4-6
    provider: anthropic
  - model: claude-opus-4-6
    name: anthropic/claude-opus-4-6
    provider: anthropic
  - model: gpt5.4-mini
    name: openai/gpt5.4-mini
    provider: openai
  - model: gemma-4-e4b-it
    name: localhost/gemma-4-e4b-it
    provider: localhost
  - model: claude-opus-4-7
    name: anthropic/claude-opus-4-7
    provider: anthropic
  providers:
  - allow_model_discovery: true
    name: anthropic
    provider: anthropic
  - allow_model_discovery: true
    name: openai
    provider: openai
  - allow_model_discovery: false
    base_url: http://localhost:1234/v1
    name: localhost
    provider: openai
memory:
  db_path: ./data/memory.db
  max_context_messages: 200
  token_window: 100000
paths:
  certs_dir: ./certs
  heartbeat_dir: ./heartbeat
  logs_dir: .logs
  memory_dir: ./memory
  sandbox_dir: ./sandbox
  skills_dir: ./skills
port: 8000
sandbox:
  env:
    GH_CONFIG_DIR: ~/.config/gh
    GIT_CONFIG_GLOBAL: ~/.gitconfig
  env_from_cmd:
    GH_TOKEN: gh auth token
  env_passthrough: []
  max_output: 10000
  timeout: 60
scheduler:
  default_channel: telegram
subagent:
  default_max_rounds: 10
  max_depth: 3
tools:
  read_file: true
  run_code: true
  web_search: true

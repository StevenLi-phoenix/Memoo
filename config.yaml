agent:
  max_tool_rounds: 0
  system_prompt: systemprompt/default.md
channels:
  telegram:
    enabled: false
    mode: polling
  wechat:
    enabled: false
    mode: polling
host: localhost
llm:
  default: anthropic
  fallback:
  - openai
  providers:
  - advisor: opus
    name: anthropic
    provider: anthropic
  - name: openai
    provider: openai
memory:
  db_path: ./data/memory.db
  max_context_messages: 200
  token_window: 100000
port: 8000
sandbox:
  max_output: 10000
  timeout: 60
tools:
  read_file: true
  run_code: true
  web_search: true

# Sub-agent spawning
subagent:
  max_depth: 3
  default_max_rounds: 10

# Embedding for semantic memory search
# provider: local (lm-studio/llama.cpp/mlx/ollama) | openai | off
embedding:
  provider: local
  base_url: http://localhost:1234/v1
  model: text-embedding-nomic-embed-text-v1.5
